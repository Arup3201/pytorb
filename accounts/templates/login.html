{% extends 'base.html' %}

{% block title %}Login - Task Orbit{%endblock%}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-12 col-sm-8 col-md-6 col-lg-4">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">Task Orbit Login</h2>

                    <form method="post" action="{% url 'accounts:login' %}">
                        {% csrf_token %}

                        {% for field in form %}
                        <div class="mb-3">
                            <label for="{{ field.id_for_label }}" class="form-label">{{ field.label }}</label>
                            {{ field }}
                        </div>
                        {% endfor %}

                        <button type="submit" class="btn btn-primary w-100">
                            Login
                        </button>
                    </form>
                    <p class="mt-3">Don't have an account yet? <a href="{% url 'accounts:register' %}">Create one</a>.
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
